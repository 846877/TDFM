name: Build TDFM.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PySide6 pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name TDFM run_tdfm.py
      - uses: actions/upload-artifact@v4
        with:
          name: TDFM-windows
          path: dist/TDFM.exe
