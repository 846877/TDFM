name: Build TDFM.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow mss
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-windows.txt pyinstaller
      - name: Test OCR Windows
        run: python tests/windows_smoke.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - run: pyinstaller --noconfirm --onefile --windowed --name TDFM --collect-all winrt --hidden-import mss run_tdfm.py
      - uses: actions/upload-artifact@v4
        with:
          name: TDFM-windows
          path: dist/TDFM.exe
